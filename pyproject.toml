[project]
name = "kescode"
version = "0.1.0"
description = "A workspace-bound coding agent CLI built with Typer and LangChain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "langchain-openai>=0.3.0,<2.0.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.5.0,<1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
kescode = "kescode.cli.app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
