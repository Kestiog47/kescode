{% extends "base.html" %}
{% block title %}首页 - 后台管理系统{% endblock %}
{% block content %}
<div class="hero bg-light rounded p-5 text-center">
    <h1 class="display-4 mb-3">Flask 后台管理系统</h1>
    <p class="lead text-muted mb-4">用户认证 / REST API / 数据库模型 / 前端模板</p>
    {% if current_user.is_authenticated %}
        <p class="mb-3">欢迎回来，<strong>{{ current_user.username }}</strong>！</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-lg">进入仪表盘</a>
    {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg me-2">登录</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-success btn-lg">注册</a>
    {% endif %}
</div>
{% endblock %}
