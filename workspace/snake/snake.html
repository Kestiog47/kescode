<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Microsoft YaHei', Arial, sans-serif;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .game-container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 25px 30px 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
  }

  h1 {
    color: #2c3e50;
    font-size: 28px;
    margin-bottom: 5px;
    letter-spacing: 3px;
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 10px 0 15px;
    font-size: 18px;
    color: #555;
  }

  .score-board span {
    font-weight: bold;
    color: #e74c3c;
    font-size: 22px;
  }

  canvas {
    background: #dfe6e9;
    border: 4px solid #2c3e50;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
  }

  .controls {
    margin-top: 18px;
  }

  button {
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 0 #1e8449;
    margin: 0 5px;
  }

  button:hover {
    background: #2ecc71;
    transform: translateY(-2px);
  }

  button:active {
    box-shadow: 0 2px 0 #1e8449;
    transform: translateY(2px);
  }

  .tips {
    margin-top: 15px;
    color: #777;
    font-size: 14px;
  }

  .game-over-mask {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 10;
  }

  .game-over-mask h2 {
    font-size: 36px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
  }

  .game-over-mask p {
    font-size: 18px;
    margin-bottom: 20px;
  }

  .canvas-wrap {
    position: relative;
    display: inline-block;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>🐍 贪吃蛇</h1>
  <div class="score-board">
    <div>分数：<span id="score">0</span></div>
    <div>最高分：<span id="highScore">0</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div class="game-over-mask hidden" id="gameOverMask">
      <h2>游戏结束</h2>
      <p>你的得分：<span id="finalScore">0</span></p>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">开始游戏</button>
  </div>
  <div class="tips">使用方向键 ↑ ↓ ← → 或 WASD 控制方向</div>
</div>

<script>
(function () {
  // ---- 游戏配置 ----
  const GRID_SIZE = 20;          // 每格像素
  const COLS = 20;               // 列数
  const ROWS = 20;               // 行数

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * GRID_SIZE;
  canvas.height = ROWS * GRID_SIZE;

  // ---- DOM 元素 ----
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const finalScoreEl = document.getElementById('finalScore');
  const gameOverMask = document.getElementById('gameOverMask');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  // ---- 游戏状态 ----
  let snake = [];                // 蛇身坐标数组（头在前）
  let food = null;               // 食物坐标
  let direction = { x: 1, y: 0 }; // 当前方向
  let nextDirection = { x: 1, y: 0 };
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
  let gameRunning = false;
  let gameOver = false;
  let gameInterval = null;
  const GAME_SPEED = 150;        // 毫秒/步

  highScoreEl.textContent = highScore;

  // ---- 辅助函数 ----
  function randomFood() {
    // 从空白格中随机选一个位置放食物
    const snakeSet = new Set(snake.map(p => p.x + ',' + p.y));
    const emptyCells = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snakeSet.has(x + ',' + y)) {
          emptyCells.push({ x, y });
        }
      }
    }
    if (emptyCells.length === 0) {
      return null; // 蛇占满了整个区域，玩家获胜
    }
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
  }

  // ---- 绘制 ----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制网格
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID_SIZE, 0);
      ctx.lineTo(i * GRID_SIZE, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * GRID_SIZE);
      ctx.lineTo(canvas.width, i * GRID_SIZE);
      ctx.stroke();
    }

    // 绘制食物
    if (food) {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    // 绘制蛇
    snake.forEach((seg, i) => {
      const x = seg.x * GRID_SIZE;
      const y = seg.y * GRID_SIZE;
      // 头部用深色，身体渐变
      if (i === 0) {
        ctx.fillStyle = '#16a085';
      } else {
        const ratio = i / snake.length;
        ctx.fillStyle = '#1abc9c';
        ctx.globalAlpha = 1 - ratio * 0.4;
      }
      ctx.fillRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      ctx.globalAlpha = 1;
    });

    // 蛇的眼睛
    if (snake.length > 0) {
      const head = snake[0];
      const hx = head.x * GRID_SIZE + GRID_SIZE / 2;
      const hy = head.y * GRID_SIZE + GRID_SIZE / 2;
      ctx.fillStyle = 'white';
      const offsetX = direction.x * 4;
      const offsetY = direction.y * 4;
      // 根据方向画两只眼睛
      const eyeOffsets = perpendicularOffsets(direction);
      drawEye(hx + offsetX + eyeOffsets[0].x * 4, hy + offsetY + eyeOffsets[0].y * 4);
      drawEye(hx + offsetX + eyeOffsets[1].x * 4, hy + offsetY + eyeOffsets[1].y * 4);
    }
  }

  function drawEye(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'white';
  }

  function perpendicularOffsets(dir) {
    if (dir.x === 0) {
      // 上下移动，眼睛在左右
      return [{ x: -1, y: 0 }, { x: 1, y: 0 }];
    }
    // 左右移动，眼睛在上下
    return [{ x: 0, y: -1 }, { x: 0, y: 1 }];
  }

  // ---- 游戏逻辑 ----
  function step() {
    // 应用下一个有效方向
    const validTurn =
      !(nextDirection.x === -direction.x && nextDirection.y === -direction.y) &&
      !(nextDirection.x === direction.x && nextDirection.y === direction.y);
    if (validTurn) {
      direction = { ...nextDirection };
    }

    const newHead = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // 检查是否撞墙
    if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
      endGame();
      return;
    }

    // 检查是否吃到食物
    const ateFood = food && newHead.x === food.x && newHead.y === food.y;

    // 检查是否撞到自己（吃到食物时尾部会移动，所以排除尾部）
    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
    const hitSelf = bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y);
    if (hitSelf) {
      endGame();
      return;
    }

    // 移动蛇
    snake.unshift(newHead);
    if (!ateFood) {
      snake.pop();
    } else {
      score += 10;
      scoreEl.textContent = score;
      food = randomFood();
      if (food === null) {
        // 赢得游戏（填满全场）
        endGame(true);
        return;
      }
    }

    draw();
  }

  function endGame(won = false) {
    gameRunning = false;
    gameOver = true;
    clearInterval(gameInterval);
    gameInterval = null;

    // 更新最高分
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
    }

    finalScoreEl.textContent = score;
    document.querySelector('#gameOverMask h2').textContent = won ? '🎉 你赢了！' : '游戏结束';
    gameOverMask.classList.remove('hidden');
  }

  function resetGame() {
    clearInterval(gameInterval);
    gameInterval = null;
    gameRunning = false;
    gameOver = false;
    gameOverMask.classList.add('hidden');

    // 初始蛇：从中间向左延伸3节
    const startX = Math.floor(COLS / 2);
    const startY = Math.floor(ROWS / 2);
    snake = [
      { x: startX, y: startY },
      { x: startX - 1, y: startY },
      { x: startX - 2, y: startY }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = score;
    food = randomFood();
    draw();
  }

  function startGame() {
    resetGame();
    gameRunning = true;
    gameInterval = setInterval(step, GAME_SPEED);
  }

  // ---- 键盘控制 ----
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    const keyMap = {
      'arrowup': { x: 0, y: -1 },
      'arrowdown': { x: 0, y: 1 },
      'arrowleft': { x: -1, y: 0 },
      'arrowright': { x: 1, y: 0 },
      'w': { x: 0, y: -1 },
      's': { x: 0, y: 1 },
      'a': { x: -1, y: 0 },
      'd': { x: 1, y: 0 }
    };

    if (keyMap[key]) {
      e.preventDefault();
      nextDirection = keyMap[key];
      // 如果游戏尚未开始，按方向键直接开始
      if (!gameRunning && !gameOver) {
        startGame();
      }
    }
  });

  // ---- 按钮事件 ----
  startBtn.addEventListener('click', () => {
    if (gameRunning) return;
    startGame();
  });

  restartBtn.addEventListener('click', () => {
    startGame();
  });

  // ---- 页面加载时绘制初始画面 ----
  resetGame();
})();
</script>
</body>
</html>
